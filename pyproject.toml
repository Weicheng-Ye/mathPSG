[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathpsg"
version = "0.1.0"
description = "Host-native GAP/Python core for Wyckoff-resolved PSG calculations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mathpsg = "mathpsg.cli:main"

[tool.setuptools.packages.find]
include = ["mathpsg*"]

[tool.setuptools.package-data]
mathpsg = [
    "_assets/data/stabilizers/v1/manifest.json",
    "_assets/data/stabilizers/v1/types.ndjson",
    "_assets/gap/classifier/lib/*.g",
    "_assets/gap/classifier/export_problem.g",
    "_assets/gap/catalogue/*.g",
    "_assets/gap/catalogue/lib/*.g",
    "_assets/resources/*.ndjson",
    "_assets/resources/*.json",
]
