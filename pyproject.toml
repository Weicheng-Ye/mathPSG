[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathpsg"
version = "0.1.0"
description = "Host-native GAP/Python core for Wyckoff-resolved PSG calculations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["mathpsg*"]

[tool.setuptools.package-data]
mathpsg = [
    "_assets/gap/catalogue/export_one.g",
    "_assets/gap/catalogue/lib/normalize_affine.g",
    "_assets/gap/classifier/lib/protocol.g",
    "_assets/gap/classifier/lib/affine_pcp.g",
    "_assets/gap/classifier/lib/resolutions.g",
    "_assets/gap/classifier/lib/restrictions.g",
    "_assets/gap/classifier/lib/bar_equivalence.g",
    "_assets/resources/wyckoff-labels.json",
]
